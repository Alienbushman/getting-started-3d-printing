server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Redirect bare /3d-printing to /3d-printing/
    location = /3d-printing {
        return 301 /3d-printing/;
    }

    location /3d-printing/ {
        alias /usr/share/nginx/html/3d-printing/;
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Serve 404 from the site's own 404 page
    error_page 404 /3d-printing/404.html;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
}
